<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Moodboost</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="stage" aria-hidden="true"></main>

  <section id="screen-start" class="screen">
    <h1>Moodboost</h1>
    <div class="modes">
      <button class="big-button" type="button" data-mode="crowd" disabled>Laughing crowd</button>
      <button class="big-button" type="button" data-mode="contagion" disabled>Try not to laugh</button>
    </div>
    <p id="hint" class="hint">Loading…</p>
    <p id="load-error" class="error" hidden></p>
  </section>

  <section id="screen-end" class="screen" hidden>
    <div class="modes">
      <button class="big-button" type="button" data-mode="crowd">Laughing crowd</button>
      <button class="big-button" type="button" data-mode="contagion">Try not to laugh</button>
    </div>
  </section>

  <button id="btn-stop" class="stop-button" type="button" hidden>Stop</button>
</body>
</html>
